<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPSC Trainings-Bibliothek</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPSC Training">
</head>
<body>
<header class="site-header">
  <h1>IPSC Trainings-Bibliothek</h1>
  <p class="subtitle">Übungen suchen, Aufbau ansehen, nachmachen.</p>
</header>

<main>
  <section class="filters" aria-label="Filter">
    <div class="filter-group">
      <label for="filter-category">Kategorie</label>
      <select id="filter-category">
        <option value="">Alle</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-difficulty">Schwierigkeit</label>
      <select id="filter-difficulty">
        <option value="">Alle</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-equipment">Ausrüstung</label>
      <select id="filter-equipment">
        <option value="">Alle</option>
      </select>
    </div>
    <button id="filter-reset" type="button">Zurücksetzen</button>
    <button id="add-drill-btn" type="button" class="add-btn">+ Eigenes Training</button>
    <span id="result-count" class="result-count"></span>
  </section>

  <section class="db-tools" aria-label="Datenbank teilen">
    <button id="restore-builtins-btn" type="button" class="tool-btn hidden">Gelöschte Standard-Trainings wiederherstellen</button>
    <button id="export-btn" type="button" class="tool-btn">⭳ Alles exportieren</button>
    <label class="own-toggle" title="Standardmäßig aus – so bleiben deine Zeiten privat, wenn du die Datei an Kollegen weitergibst.">
      <input type="checkbox" id="export-include-scores">
      Eigene Zeiten mit exportieren
    </label>
    <button id="import-btn" type="button" class="tool-btn">⭱ Importieren</button>
    <input type="file" id="import-file-input" accept="application/json" class="hidden">
    <span id="db-tools-msg" class="db-tools-msg"></span>
  </section>

  <section id="drill-grid" class="drill-grid" aria-label="Trainings"></section>
</main>

<div id="detail-overlay" class="overlay hidden">
  <div class="detail-panel" role="dialog" aria-modal="true">
    <button id="detail-close" class="close-btn" aria-label="Schließen">×</button>
    <div id="detail-content"></div>
  </div>
</div>

<div id="create-overlay" class="overlay hidden">
  <div class="detail-panel create-panel" role="dialog" aria-modal="true">
    <button id="create-close" class="close-btn" aria-label="Schließen">×</button>
    <h2 id="create-title">Eigenes Training erstellen</h2>

    <form id="create-form">
      <div class="form-grid">
        <label class="form-field">
          <span>Titel *</span>
          <input type="text" id="f-title" required>
        </label>
        <label class="form-field">
          <span>Kategorie *</span>
          <input type="text" id="f-category" list="category-options" required placeholder="z.B. Speed-Drill">
          <datalist id="category-options"></datalist>
        </label>
        <label class="form-field">
          <span>Schwierigkeit</span>
          <input type="text" id="f-difficulty" list="difficulty-options" placeholder="z.B. Fortgeschritten">
          <datalist id="difficulty-options"></datalist>
        </label>
        <div class="form-field">
          <span>Ausrüstung</span>
          <div class="multiselect" id="equipment-multiselect">
            <button type="button" id="equipment-ms-btn" class="multiselect-btn">Auswählen…</button>
            <div class="multiselect-panel hidden" id="equipment-ms-panel">
              <div id="equipment-checkboxes" class="multiselect-checkboxes"></div>
              <div class="multiselect-add-row">
                <input type="text" id="equipment-new-input" placeholder="Neue Ausrüstung…">
                <button type="button" id="equipment-add-btn" class="tool-btn">+ Hinzufügen</button>
              </div>
            </div>
          </div>
        </div>
        <label class="form-field">
          <span>Schusszahl</span>
          <input type="number" id="f-rounds" min="1" step="1">
        </label>
        <label class="form-field">
          <span>Distanz</span>
          <input type="text" id="f-distance" placeholder="z.B. 7 m">
        </label>
        <label class="form-field form-field-wide">
          <span>Par-Zeit / Ziel</span>
          <input type="text" id="f-partime" placeholder="z.B. kein festes Par – Hit-Factor-Prinzip">
        </label>
        <label class="form-field form-field-wide">
          <span>Ablauf *</span>
          <textarea id="f-procedure" required rows="3"></textarea>
        </label>
        <label class="form-field form-field-wide">
          <span>Fokus</span>
          <textarea id="f-focus" rows="2"></textarea>
        </label>
      </div>

      <div class="section-title">Stage-Skizze bauen</div>
      <div class="builder-toolbar">
        <button type="button" class="tool-btn tool-select active" data-tool="target">Target</button>
        <button type="button" class="tool-btn tool-select" data-tool="steel">⬤ Plate</button>
        <button type="button" class="tool-btn tool-select" data-tool="popper">Popper</button>
        <button type="button" class="tool-btn tool-select" data-tool="pendler">Pendler</button>
        <button type="button" class="tool-btn tool-select" data-tool="updown">Up-Down-Ziel</button>
        <button type="button" class="tool-btn tool-select" data-tool="noshoot">No-Shoot</button>
        <button type="button" class="tool-btn tool-select" data-tool="shooter">Schütze</button>
      </div>
      <div class="builder-toolbar">
        <button type="button" class="tool-btn tool-select" data-tool="wall">Wand (2 Klicks)</button>
        <button type="button" class="tool-btn tool-select" data-tool="box">Box (2 Klicks)</button>
        <button type="button" class="tool-btn tool-select" data-tool="tisch">Tisch</button>
        <button type="button" class="tool-btn tool-select" data-tool="sessel">Sessel</button>
        <button type="button" class="tool-btn tool-select tool-delete" data-tool="delete">🗑 Löschen</button>
      </div>
      <div class="builder-toolbar">
        <button type="button" id="rotate-shooter-btn" class="tool-btn">Schütze drehen 45°</button>
        <button type="button" id="undo-btn" class="tool-btn">Rückgängig</button>
        <button type="button" id="clear-builder-btn" class="tool-btn">Alles leeren</button>
      </div>
      <div class="layout-svg-wrap builder-svg-wrap">
        <svg id="builder-svg" viewBox="0 0 400 500" width="360" height="450"></svg>
      </div>
      <p class="builder-hint" id="builder-hint">Klicke in die Fläche, um ein Ziel zu platzieren.</p>

      <div class="form-actions">
        <button type="button" id="create-cancel" class="tool-btn">Abbrechen</button>
        <button type="submit" class="save-btn" id="save-btn">Training speichern</button>
      </div>
    </form>
  </div>
</div>

<script src="data/drills.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => { /* offline caching unavailable, app still works online */ });
    });
  }
</script>
</body>
</html>
